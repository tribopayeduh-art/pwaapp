<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C24"/>
      <stop offset="50%" stop-color="#0E1B4D"/>
      <stop offset="100%" stop-color="#050A1F"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2979FF"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D500F9"/>
      <stop offset="100%" stop-color="#651FFF"/>
    </linearGradient>

    <linearGradient id="chestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="500" rx="30" fill="url(#bgGrad)" stroke="#1A3375" stroke-width="6"/>

  <!-- Subtle Cyber Grid -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M200 0 V500 M400 0 V500 M600 0 V500 M800 0 V500 M1000 0 V500" stroke="#182B66" stroke-width="1.5" opacity="0.3"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="200" r="180" fill="#00E5FF" opacity="0.12" filter="blur(40px)"/>
  <circle cx="950" cy="220" r="220" fill="#FFD54F" opacity="0.15" filter="blur(50px)"/>

  <!-- LEFT TEXT SECTION -->
  <g transform="translate(60, 60)">
    <!-- QUANTO -->
    <text x="0" y="55" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="4">QUANTO</text>
    
    <!-- MAIOR -->
    <text x="0" y="130" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="82" fill="url(#goldGrad)" filter="url(#glowGold)" italic="true" letter-spacing="2">MAIOR</text>
    
    <!-- SEU DEPÓSITO -->
    <text x="0" y="195" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="58" fill="url(#cyanGrad)" filter="url(#glowCyan)" letter-spacing="3">SEU DEPÓSITO</text>
    
    <!-- MAIORES -->
    <text x="0" y="275" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="86" fill="url(#goldGrad)" filter="url(#glowGold)" italic="true" letter-spacing="2">MAIORES</text>
    
    <!-- SUAS CHANCES -->
    <text x="0" y="340" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="62" fill="url(#cyanGrad)" filter="url(#glowCyan)" letter-spacing="3">SUAS CHANCES</text>
  </g>

  <!-- RIGHT ARTWORK SECTION (Treasure Box, Coins, Tetris Blocks, Logo) -->
  <g transform="translate(680, 50)">
    
    <!-- Tetris Blocks Composition -->
    <!-- Gold T-Piece -->
    <g transform="translate(110, 40) rotate(-10)" filter="url(#glowGold)">
      <rect x="0" y="0" width="45" height="45" rx="8" fill="url(#goldGrad)" stroke="#FFF" stroke-width="2"/>
      <rect x="45" y="0" width="45" height="45" rx="8" fill="url(#goldGrad)" stroke="#FFF" stroke-width="2"/>
      <rect x="90" y="0" width="45" height="45" rx="8" fill="url(#goldGrad)" stroke="#FFF" stroke-width="2"/>
      <rect x="45" y="45" width="45" height="45" rx="8" fill="url(#goldGrad)" stroke="#FFF" stroke-width="2"/>
    </g>

    <!-- Treasure Box Base -->
    <rect x="100" y="180" width="220" height="150" rx="24" fill="url(#chestGrad)" stroke="#2979FF" stroke-width="5" filter="url(#glowCyan)"/>
    <!-- Box Star Badge -->
    <polygon points="210,230 217,250 238,250 221,262 227,282 210,270 193,282 199,262 182,250 203,250" fill="#FFD54F" />

    <!-- Overflowing Gold Coins -->
    <circle cx="160" cy="170" r="24" fill="url(#goldGrad)" stroke="#FFF" stroke-width="2"/>
    <circle cx="210" cy="155" r="28" fill="url(#goldGrad)" stroke="#FFF" stroke-width="2"/>
    <circle cx="260" cy="175" r="22" fill="url(#goldGrad)" stroke="#FFF" stroke-width="2"/>
    <circle cx="120" cy="190" r="18" fill="url(#goldGrad)" stroke="#FFF" stroke-width="2"/>

    <!-- Floating Cyan Block Left -->
    <rect x="20" y="140" width="42" height="42" rx="8" fill="#00E5FF" stroke="#FFF" stroke-width="2" transform="rotate(15)" filter="url(#glowCyan)"/>

    <!-- Floating Purple Block Right -->
    <rect x="330" y="130" width="42" height="42" rx="8" fill="#D500F9" stroke="#FFF" stroke-width="2" transform="rotate(-20)"/>

    <!-- BLOCK WIN Logo Tag -->
    <g transform="translate(200, 25)">
      <!-- Crown -->
      <path d="M40 10 L50 30 L65 15 L80 30 L90 10 L85 40 L35 40 Z" fill="#FFD54F" filter="url(#glowGold)"/>
      <text x="65" y="62" font-family="'Arial Black', sans-serif" font-weight="900" font-size="26" fill="#FFD54F" text-anchor="middle">BLOCK</text>
      <text x="135" y="62" font-family="'Arial Black', sans-serif" font-weight="900" font-size="26" fill="#00E5FF" italic="true">WIN</text>
    </g>
  </g>

  <!-- BOTTOM BADGES BAR -->
  <g transform="translate(0, 420)">
    <rect x="0" y="0" width="1200" height="80" fill="#040817" opacity="0.8"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#1A3375" stroke-width="3"/>

    <!-- Badge 1: Depósito Seguro -->
    <g transform="translate(180, 25)">
      <path d="M12 2 L2 7 V14 C2 20 12 25 12 25 C12 25 22 20 22 14 V7 Z" fill="none" stroke="#00E5FF" stroke-width="2.5"/>
      <text x="32" y="18" font-family="'Arial', sans-serif" font-weight="900" font-size="18" fill="#E0F7FA" letter-spacing="1">DEPÓSITO SEGURO</text>
    </g>

    <!-- Badge 2: Mais Depósito Mais Prêmios -->
    <g transform="translate(480, 25)">
      <path d="M5 22 H19 V12 H5 Z M12 2 L16 8 H8 Z" fill="none" stroke="#FFD54F" stroke-width="2.5"/>
      <text x="32" y="18" font-family="'Arial', sans-serif" font-weight="900" font-size="18" fill="#FFF8E1" letter-spacing="1">MAIS DEPÓSITO MAIS PRÊMIOS</text>
    </g>

    <!-- Badge 3: Prêmios Incríveis -->
    <g transform="translate(860, 25)">
      <rect x="2" y="6" width="20" height="16" rx="3" fill="none" stroke="#E040FB" stroke-width="2.5"/>
      <path d="M12 2 V22 M2 12 H22" stroke="#E040FB" stroke-width="2"/>
      <text x="32" y="18" font-family="'Arial', sans-serif" font-weight="900" font-size="18" fill="#F3E5F5" letter-spacing="1">PRÊMIOS INCRÍVEIS</text>
    </g>
  </g>
</svg>
