  <body>
    <div id="root"></div>

    <div id="bb-auth-modal-wrap" style="display: none;">
      <div class="bb-auth-box">
        <div class="bb-auth-header">
          <img class="bb-auth-logo" src="images/favicon-iconb.png" alt="Bubble Blast">
          <h2 id="bb-auth-title">Acesse sua Conta</h2>
          <p id="bb-auth-desc">Informe seu e-mail e senha para jogar e sacar via PIX.</p>
        </div>

        <div class="bb-auth-tabs">
          <button type="button" class="bb-auth-tab active" id="bb-tab-login">Entrar</button>
          <button type="button" class="bb-auth-tab" id="bb-tab-register">Criar Conta</button>
        </div>

        <div id="bb-auth-error" class="bb-auth-error"></div>

        <form id="bb-auth-form" class="bb-auth-form">
          <div class="bb-input-group" id="bb-group-name" style="display: none;">
            <label for="bb-input-name">Nome Completo</label>
            <input type="text" id="bb-input-name" placeholder="Seu nome" autocomplete="name" maxlength="80">
          </div>

          <div class="bb-input-group">
            <label for="bb-input-email">E-mail</label>
            <input type="email" id="bb-input-email" placeholder="seu@email.com" autocomplete="email" required maxlength="120">
          </div>

          <div class="bb-input-group">
            <label for="bb-input-password">Senha</label>
            <input type="password" id="bb-input-password" placeholder="Sua senha" autocomplete="current-password" required minlength="6" maxlength="128">
          </div>

          <div class="bb-input-group" id="bb-group-confirm" style="display: none;">
            <label for="bb-input-confirm">Confirmar Senha</label>
            <input type="password" id="bb-input-confirm" placeholder="Repita a senha" autocomplete="new-password" minlength="6" maxlength="128">
          </div>

          <button type="submit" class="bb-auth-btn" id="bb-auth-submit-btn">Entrar na conta</button>
        </form>

        <div class="bb-auth-footer">
          <span>🔒 Acesso seguro e oficial Bubble Win</span>
        </div>
      </div>
    </div>

    <script>
      (function() {
        var modal = document.getElementById('bb-auth-modal-wrap');
        var tabLogin = document.getElementById('bb-tab-login');
        var tabReg = document.getElementById('bb-tab-register');
        var groupName = document.getElementById('bb-group-name');
        var groupConfirm = document.getElementById('bb-group-confirm');
        var inputName = document.getElementById('bb-input-name');
        var inputEmail = document.getElementById('bb-input-email');
        var inputPass = document.getElementById('bb-input-password');
        var inputConfirm = document.getElementById('bb-input-confirm');
        var title = document.getElementById('bb-auth-title');
        var desc = document.getElementById('bb-auth-desc');
        var submitBtn = document.getElementById('bb-auth-submit-btn');
        var errorEl = document.getElementById('bb-auth-error');
        var form = document.getElementById('bb-auth-form');

        var isRegister = false;

        function setMode(reg) {
          isRegister = reg;
          tabLogin.classList.toggle('active', !reg);
          tabReg.classList.toggle('active', reg);
          groupName.style.display = reg ? 'flex' : 'none';
          groupConfirm.style.display = reg ? 'flex' : 'none';
          if (reg) {
            inputName.setAttribute('required', 'required');
            inputConfirm.setAttribute('required', 'required');
            title.textContent = 'Criar Nova Conta';
            desc.textContent = 'Cadastre seu e-mail e senha para começar.';
            submitBtn.textContent = 'Criar minha conta';
          } else {
            inputName.removeAttribute('required');
            inputConfirm.removeAttribute('required');
            title.textContent = 'Acesse sua Conta';
            desc.textContent = 'Informe seu e-mail e senha para jogar.';
            submitBtn.textContent = 'Entrar na conta';
          }
          errorEl.style.display = 'none';
          errorEl.textContent = '';
        }

        tabLogin.addEventListener('click', function() { setMode(false); });
        tabReg.addEventListener('click', function() { setMode(true); });

        function showError(msg) {
          errorEl.textContent = msg;
          errorEl.style.display = 'block';
        }

        function getStoredToken() {
          return localStorage.getItem('bb_token') ||
                 localStorage.getItem('bb_session') ||
                 localStorage.getItem('pg_auth_token') ||
                 localStorage.getItem('token') || '';
        }

        function checkAuth() {
          var token = getStoredToken();
          if (!token) {
            modal.style.display = 'flex';
            if (location.pathname.includes('cadastro')) {
              setMode(true);
            }
            return;
          }
          fetch('/api/auth/me', {
            headers: {
              'Authorization': 'Bearer ' + token,
              'X-Game-Origin': 'g_bubble_blast',
              'X-Game-Id': 'g_bubble_blast'
            }
          }).then(function(res) {
            return res.ok ? res.json() : null;
          }).then(function(data) {
            if (data && data.user) {
              modal.style.display = 'none';
              var path = location.pathname;
              if (path === '/' || path === '/bubbleblast' || path === '/bubbleblast/' || path === '/login' || path === '/cadastro') {
                var target = path.startsWith('/bubbleblast') ? '/bubbleblast/painel' : '/painel';
                location.replace(target);
              }
            } else {
              localStorage.removeItem('bb_token');
              localStorage.removeItem('bb_session');
              modal.style.display = 'flex';
            }
          }).catch(function() {
            modal.style.display = 'none';
          });
        }

        form.addEventListener('submit', function(e) {
          e.preventDefault();
          errorEl.style.display = 'none';
          var email = inputEmail.value.trim().toLowerCase();
          var pass = inputPass.value;

          if (!email || !pass) {
            showError('E-mail e senha são obrigatórios.');
            return;
          }

          if (isRegister) {
            var name = inputName.value.trim();
            var confirm = inputConfirm.value;
            if (name.length < 2) {
              showError('Informe seu nome completo.');
              return;
            }
            if (pass.length < 6) {
              showError('A senha deve ter pelo menos 6 caracteres.');
              return;
            }
            if (pass !== confirm) {
              showError('As senhas digitadas não conferem.');
              return;
            }

            var ref = localStorage.getItem('bb_ref_code') || localStorage.getItem('bb-ref') || localStorage.getItem('alliance_ref_code') || localStorage.getItem('refCode') || '';
            var partner = localStorage.getItem('bb_partner_code') || localStorage.getItem('bb-partner') || localStorage.getItem('partnerCode') || '';

            var utmParams = {};
            ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'src', 'sck'].forEach(function(k) {
              var v = localStorage.getItem('bb_' + k) || localStorage.getItem(k) || sessionStorage.getItem('bb_' + k) || sessionStorage.getItem(k);
              if (v) utmParams[k] = v;
            });

            submitBtn.disabled = true;
            submitBtn.textContent = 'Criando conta...';

            fetch('/api/auth/register', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Game-Origin': 'g_bubble_blast',
                'X-Game-Id': 'g_bubble_blast',
                'X-Registered-Game': 'g_bubble_blast'
              },
              body: JSON.stringify(Object.assign({
                name: name,
                email: email,
                password: pass,
                phone: 'Não informado',
                refCode: ref,
                partner: partner,
                partnerCode: partner,
                game: 'g_bubble_blast',
                gameId: 'g_bubble_blast',
                registeredGame: 'g_bubble_blast',
                acquisitionGame: 'g_bubble_blast',
                trackingGame: 'g_bubble_blast',
                trackingSource: 'jogarbubble_domain'
              }, utmParams))
            }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
              .then(function(res) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Criar minha conta';
                if (!res.ok) {
                  showError(res.data.error || res.data.message || 'Erro ao realizar cadastro.');
                  return;
                }
                if (res.data.token) {
                  localStorage.setItem('bb_token', res.data.token);
                  localStorage.setItem('bb_session', res.data.token);
                  localStorage.setItem('pg_auth_token', res.data.token);
                  localStorage.setItem('paygateway_token', res.data.token);
                  localStorage.setItem('token', res.data.token);
                }
                try {
                  if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ source: 'bubble-blast-shell', event: 'auth', token: res.data.token, user: res.data.user }, '*');
                  }
                } catch(_) {}
                modal.style.display = 'none';
                var target = location.pathname.startsWith('/bubbleblast') ? '/bubbleblast/painel' : '/painel';
                location.replace(target);
              }).catch(function(err) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Criar minha conta';
                showError('Erro de conexão ao cadastrar. Tente novamente.');
              });
          } else {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';

            fetch('/api/auth/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Game-Origin': 'g_bubble_blast',
                'X-Game-Id': 'g_bubble_blast'
              },
              body: JSON.stringify({
                email: email,
                password: pass,
                game: 'g_bubble_blast',
                gameId: 'g_bubble_blast',
                registeredGame: 'g_bubble_blast',
                acquisitionGame: 'g_bubble_blast'
              })
            }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
              .then(function(res) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar na conta';
                if (!res.ok) {
                  showError(res.data.error || res.data.message || 'E-mail ou senha incorretos.');
                  return;
                }
                if (res.data.token) {
                  localStorage.setItem('bb_token', res.data.token);
                  localStorage.setItem('bb_session', res.data.token);
                  localStorage.setItem('pg_auth_token', res.data.token);
                  localStorage.setItem('paygateway_token', res.data.token);
                  localStorage.setItem('token', res.data.token);
                }
                try {
                  if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ source: 'bubble-blast-shell', event: 'auth', token: res.data.token, user: res.data.user }, '*');
                  }
                } catch(_) {}
                modal.style.display = 'none';
                var target = location.pathname.startsWith('/bubbleblast') ? '/bubbleblast/painel' : '/painel';
                location.replace(target);
              }).catch(function(err) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar na conta';
                showError('Erro de conexão ao entrar. Tente novamente.');
              });
          }
        });

        // Intercept clicks on landing page CTA buttons to open Auth
        document.addEventListener('click', function(e) {
          var target = e.target.closest('button, a');
          if (!target) return;
          var text = (target.textContent || '').trim().toLowerCase();
          if (text.includes('jogar') || text.includes('conta') || text.includes('entrar') || text.includes('cadastr')) {
            var token = getStoredToken();
            if (!token) {
              e.preventDefault();
              e.stopPropagation();
              setMode(text.includes('cadastr') || text.includes('grátis') || text.includes('gratis'));
              modal.style.display = 'flex';
            }
          }
        }, true);

        // Run auth verification
        checkAuth();
      })();
    </script>
